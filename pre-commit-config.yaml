repos:
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.3.0.dev4  # Note: this is the version of the pre-commit hook, NOT the pyrefly version used for type checking
    hooks:
      - id: pyrefly-check
        name: Pyrefly (type checking)
        pass_filenames: true  # Recommended to do full repo checks. However, you can change this to `true` to only check changed files
        language: system  # Use system-installed pyrefly

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.6
    hooks:
      # Run the linter.
      - id: ruff-check
      # Run the formatter.
      - id: ruff-format
        args: [ --check ] # only check do not modify files

  # Golang
  - repo: local
    hooks:
      - id: go-fmt
        name: Format golang code
        entry: go fmt 
        language: system
        files: '\.go$'
